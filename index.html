<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Calculate overtime pay including time and a half, double time and custom rates. See your gross pay with overtime included." />

<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return '$'+n.toFixed(2);}
function fmtBig(n){return '$'+Math.round(n).toLocaleString();}

function App() {
  const [hourly, setHourly] = useState(20);
  const [regular, setRegular] = useState(40);
  const [ot1, setOt1] = useState(8);
  const [ot1rate, setOt1rate] = useState(1.5);
  const [ot2, setOt2] = useState(0);
  const [ot2rate, setOt2rate] = useState(2);
  const [days, setDays] = useState(5);

  const h = Number(hourly)||0;
  const reg = Number(regular)||0;
  const o1 = Number(ot1)||0;
  const o2 = Number(ot2)||0;
  const d = Number(days)||5;

  const regPay = h * reg;
  const ot1Pay = h * Number(ot1rate) * o1;
  const ot2Pay = h * Number(ot2rate) * o2;
  const totalWeekly = regPay + ot1Pay + ot2Pay;
  const totalAnnual = totalWeekly * 52;
  const extraVsNoOT = (ot1Pay + ot2Pay);

  const ot1Rate = h * Number(ot1rate);
  const ot2Rate = h * Number(ot2rate);

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#7c2d12,#c2410c)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🕐</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Overtime Pay Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>Time & a half · double time · custom OT rates</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[
              ['Base Hourly Rate','$',hourly,setHourly],
              ['Regular Hours / Week','hrs',regular,setRegular],
            ].map(([l,p,v,s])=>(
              <div key={l}>
                <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>{l}</label>
                <div style={{position:'relative'}}>
                  <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#9ca3af',fontSize:13}}>{p}</span>
                  <input type="number" value={v} onChange={e=>s(e.target.value)}
                    style={{width:'100%',padding:`9px 9px 9px ${p.length>2?'32px':'24px'}`,borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
                </div>
              </div>
            ))}
          </div>

          <div style={{borderTop:'1px solid #f0f0f0',margin:'16px 0 12px',paddingTop:12,fontWeight:700,color:'#374151',fontSize:13}}>Overtime 1 (e.g. Time & a Half)</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:12,color:'#6b7280',display:'block',marginBottom:5}}>OT Hours</label>
              <input type="number" value={ot1} onChange={e=>setOt1(e.target.value)}
                style={{width:'100%',padding:'9px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
            <div>
              <label style={{fontSize:12,color:'#6b7280',display:'block',marginBottom:5}}>Multiplier (e.g. 1.5)</label>
              <input type="number" value={ot1rate} onChange={e=>setOt1rate(e.target.value)} step="0.25"
                style={{width:'100%',padding:'9px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
          </div>

          <div style={{borderTop:'1px solid #f0f0f0',margin:'16px 0 12px',paddingTop:12,fontWeight:700,color:'#374151',fontSize:13}}>Overtime 2 (e.g. Double Time)</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:12,color:'#6b7280',display:'block',marginBottom:5}}>OT Hours</label>
              <input type="number" value={ot2} onChange={e=>setOt2(e.target.value)}
                style={{width:'100%',padding:'9px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
            <div>
              <label style={{fontSize:12,color:'#6b7280',display:'block',marginBottom:5}}>Multiplier (e.g. 2.0)</label>
              <input type="number" value={ot2rate} onChange={e=>setOt2rate(e.target.value)} step="0.25"
                style={{width:'100%',padding:'9px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
          </div>
        </div>

        <div style={{background:'linear-gradient(135deg,#fff7ed,#ffedd5)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#9a3412'}}>TOTAL WEEKLY PAY</div>
          <div style={{fontSize:48,fontWeight:900,color:'#c2410c',margin:'6px 0'}}>{fmtBig(totalWeekly)}</div>
          <div style={{fontSize:14,color:'#9a3412',fontWeight:600}}>+{fmt(extraVsNoOT)} extra vs no OT</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Base Rate', fmt(h)+'/hr'],
            ['Regular Pay', fmtBig(regPay)+` (${reg} hrs × ${fmt(h)})`],
            ['OT Rate 1', fmt(ot1Rate)+`/hr (×${ot1rate})`],
            ['OT 1 Pay', fmtBig(ot1Pay)+` (${o1} hrs)`],
            ...(o2>0?[['OT Rate 2', fmt(ot2Rate)+`/hr (×${ot2rate})`],['OT 2 Pay', fmtBig(ot2Pay)+` (${o2} hrs)`]]:[]),
            ['Gross Weekly', fmtBig(totalWeekly)],
            ['Annual (×52)', fmtBig(totalAnnual)],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#fff7ed',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#9a3412',lineHeight:1.6}}>
          <strong>US federal law (FLSA):</strong> time and a half (1.5×) is required for hours over 40/week for non-exempt employees. Some states (CA, CO) require daily OT over 8 hrs. Double time rules vary by state.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
